<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef7ea">
<title>Finanças</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
:root { --bg: #eef7ea; --surface: #ffffff; --surface-2: #f4faf0; --line: #d0e2c9; --line-soft: #e2eedb; --fg: #1a2a1a; --muted: #5a6b58; --accent: #f0d75c; --accent-fg: #2b2400; --accent-soft: rgba(240,215,92,.38); --field: #ffffff; --danger: #b42318; --neutral-bg: #dfeeda; --neutral-fg: #6b7d68; --s1-bg: #15803d; --s1-fg: #ffffff; --s2-bg: #b7e4c2; --s2-fg: #0d3b1b; --s3-bg: #fbe38a; --s3-fg: #3f3000; --s4-bg: #f2a39d; --s4-fg: #55110d; --s5-bg: #8a1a1a; --s5-fg: #ffffff; --k-entrada: #15803d; --k-saida: #c93a3a; --k-gasto: #d97706; --k-cartao: #7c3aed; --k-reserva: #2563eb; --radius: 12px; --radius-sm: 10px; --font-body: "IBM Plex Sans", Roboto, system-ui, sans-serif; --font-head: "Space Grotesk", "IBM Plex Sans", sans-serif; --font-num: "IBM Plex Mono", ui-monospace, monospace; --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275); --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1419; --surface: #171f28; --surface-2: #1c2530; --line: #2a3541; --line-soft: #212b36; --fg: #e7ecf1; --muted: #93a0ae; --accent: #6aa9ec; --accent-fg: #08121d; --accent-soft: rgba(106,169,236,.18); --field: #0f1419; --danger: #ff8f86; --neutral-bg: #212b36; --neutral-fg: #8190a0; --k-entrada: #3fb96a; --k-saida: #f0716b; --k-gasto: #f5a623; --k-cartao: #a78bfa; --k-reserva: #6aa9ec; color-scheme: dark; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; overscroll-behavior-y: contain; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body { padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); min-height: 100dvh; }
h1, h2, h3, p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
#login-screen { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
.login-card h2 { text-align: center; font: 600 22px var(--font-head); }
.login-card p { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.login-card .btn { margin-top: 8px; }
.login-msg { color: var(--danger); font-size: 13px; text-align: center; min-height: 18px; font-weight: 500; }
.toggle-auth { text-align: center; font-size: 13px; color: var(--accent); cursor: pointer; font-weight: 600; margin-top: 8px; }
.app { max-width: 1120px; margin-inline: auto; display: grid; gap: 16px; padding-top: 16px; }
.pane { display: grid; gap: 16px; min-width: 0; }
.btn { font: 500 14px var(--font-body); min-height: 44px; padding: 0 16px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: var(--radius-sm); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.fld { min-height: 44px; border: 1px solid var(--line); background: var(--field); color: var(--fg); border-radius: var(--radius-sm); padding: 0 12px; font: 16px var(--font-body); width: 100%; }
.fld:focus { outline: none; border-color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h2 id="auth-title">Entrar no Finanças</h2>
    <p>Use um apelido e uma senha para acessar de qualquer lugar.</p>
    <input type="text" id="login-user" class="fld" placeholder="Seu apelido (ex: janiel)" autocomplete="username">
    <input type="password" id="login-pass" class="fld" placeholder="Sua senha" autocomplete="current-password">
    <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;margin-top:4px">
      <input type="checkbox" id="login-remember" checked style="width:18px;height:18px;accent-color:var(--accent)">
      Manter conectado neste aparelho
    </label>
    <p class="login-msg" id="login-msg"></p>
    <button class="btn primary" id="btn-auth-submit">Entrar</button>
    <div class="toggle-auth" id="toggle-auth">Não tem conta? Criar agora</div>
  </div>
</div>

<div id="app-screen" hidden>
  <header class="app-bar" style="padding:16px;background:var(--surface);display:flex;justify-content:space-between;align-items:center">
    <h1>Finanças</h1>
    <button class="btn" id="btn-logout">Sair</button>
  </header>
  <main class="app">
    <div class="card">
      <h2>Logado com Sucesso!</h2>
      <p class="muted" id="user-email"></p>
      <p style="margin-top:16px;font-size:24px;font-weight:bold" id="sync">Sincronizado</p>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyArVFKF2LqcfhgNNTtGrULCPaxey-Tlz1Y",
  authDomain: "financas-app-e83ad.firebaseapp.com",
  projectId: "financas-app-e83ad",
  storageBucket: "financas-app-e83ad.firebasestorage.app",
  messagingSenderId: "387620736286",
  appId: "1:387620736286:web:d640ff28fc1b04da604d0f"
};

let auth, db;
try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  console.log("Firebase inicializado.");
} catch (e) {
  console.error("Erro ao iniciar Firebase:", e);
}

const $ = id => document.getElementById(id);
let isRegistering = false;

$('toggle-auth').onclick = () => {
  isRegistering = !isRegistering;
  $('auth-title').textContent = isRegistering ? 'Criar Conta' : 'Entrar';
  $('btn-auth-submit').textContent = isRegistering ? 'Cadastrar' : 'Entrar';
  $('toggle-auth').textContent = isRegistering ? 'Já tem conta? Fazer login' : 'Não tem conta? Criar agora';
  $('login-msg').textContent = '';
};

$('btn-auth-submit').onclick = async () => {
  console.log("=> Botão clicado.");
  if(!auth) return console.error("Auth não inicializado!");
  
  const username = $('login-user').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  const pass = $('login-pass').value;
  console.log("=> Tentando:", username, "Modo:", isRegistering ? "Cadastro" : "Login");

  if(username.length < 3) return $('login-msg').textContent = 'O apelido precisa ter 3 letras ou mais.';
  if(pass.length < 6) return $('login-msg').textContent = 'A senha precisa ter 6 caracteres ou mais.';

  const fakeEmail = username + '@financas.app';
  $('login-msg').textContent = 'Conectando...';
  $('btn-auth-submit').disabled = true;

  try {
    console.log("=> Configurando persistencia...");
    await auth.setPersistence($('login-remember').checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    
    console.log("=> Chamando Firebase...");
    if (isRegistering) {
      await auth.createUserWithEmailAndPassword(fakeEmail, pass);
    } else {
      await auth.signInWithEmailAndPassword(fakeEmail, pass);
    }
    console.log("=> SUCESSO NO LOGIN!");
  } catch(e) {
    console.error("=> ERRO NO FIREBASE:", e.code, e.message);
    if(e.code === 'auth/wrong-password') $('login-msg').textContent = 'Senha incorreta.';
    else if(e.code === 'auth/user-not-found') $('login-msg').textContent = 'Esse apelido não existe.';
    else if(e.code === 'auth/email-already-in-use') $('login-msg').textContent = 'Esse apelido já está em uso.';
    else $('login-msg').textContent = 'Erro: ' + e.message;
  } finally {
    $('btn-auth-submit').disabled = false;
  }
};

$('btn-logout').onclick = () => auth.signOut();

if(auth) {
  auth.onAuthStateChanged(user => {
    console.log("=> Mudança de estado de Auth. User:", user ? user.email : "Nenhum");
    if (user) {
      $('user-email').textContent = user.email.replace('@financas.app', '');
      $('login-screen').hidden = true;
      $('app-screen').hidden = false;
      
      try {
        db.collection('users').doc(user.uid).onSnapshot(doc => {
          console.log("=> Firestore conectado com sucesso.");
        }, error => {
          console.error("=> ERRO NO FIRESTORE (Regras?):", error);
        });
      } catch(e) {
        console.error("=> Erro geral Firestore:", e);
      }
    } else {
      $('login-screen').hidden = false;
      $('app-screen').hidden = true;
    }
  });
}
</script>
</body>
</html>
